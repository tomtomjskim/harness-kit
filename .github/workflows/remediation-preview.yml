name: Remediation Preview

on:
  push:
    branches: [agent/portfolio-validation-ci]

permissions:
  contents: read

jobs:
  audit-fix-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update lockfile within declared semver ranges
        run: npm audit fix --package-lock-only
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Show lockfile diff
        run: git diff -- package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-remediated-lockfile
          path: package-lock.json
          if-no-files-found: error
