name: Apply Audit Remediation

on:
  push:
    branches: [agent/portfolio-validation-ci]

permissions:
  contents: write

jobs:
  apply-lockfile:
    if: "${{ github.event.head_commit.message != 'chore: apply npm audit lockfile remediation' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portfolio-validation-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update lockfile within declared semver ranges
        run: npm audit fix --package-lock-only || true
      - name: Verify production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit remediated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: apply npm audit lockfile remediation'
          git push origin HEAD:agent/portfolio-validation-ci
